name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web bundle
        # GitHub Pages serves project sites from /<repo>/, so the bundle needs
        # that prefix on every asset URL.
        env:
          EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
        run: npm run build:web

      - name: Prepare for Pages
        run: |
          # Without this, Jekyll drops the _expo directory and nothing loads.
          touch dist/.nojekyll
          # Single-page app: unknown paths fall back to the entry point.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
