name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Work out the base path
        id: base
        run: |
          # A custom domain (CNAME) serves the site from the root of that
          # domain. Without one, GitHub Pages serves a project site from
          # /<repo>/ and every asset URL needs that prefix.
          if [ -f CNAME ]; then
            echo "Custom domain: $(cat CNAME) -- building for the domain root"
            echo "url=" >> "$GITHUB_OUTPUT"
          else
            echo "Project site -- building for /${{ github.event.repository.name }}"
            echo "url=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web bundle
        env:
          EXPO_PUBLIC_BASE_URL: ${{ steps.base.outputs.url }}
        run: npm run build:web

      - name: Prepare for Pages
        run: |
          # Without this, Jekyll drops the _expo directory and nothing loads.
          touch dist/.nojekyll
          # Single-page app: unknown paths fall back to the entry point.
          cp dist/index.html dist/404.html
          # Carry the custom domain into the published artifact.
          [ -f CNAME ] && cp CNAME dist/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
