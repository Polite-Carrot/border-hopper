name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Generated data is up to date with its generators
        run: |
          npm run build:data
          npm run build:campaign
          git diff --exit-code src/data/world.generated.json src/data/campaign.generated.json
